<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="The Ultimate Kolkata Durga Puja Navigation Guide.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hoppers">
  <!-- PWA Icon Update -->
  <link rel="apple-touch-icon" href="icons/icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="icons/icon-512.png"/>

  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.json">
  <title>Hoppers</title>

  <!-- Custom Splash Screen CSS with new Image -->
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100vw;
      overflow: hidden;
    }

    #splash-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #0B132B;
      /* Link to the new splash image */
      background-image: url('icons/splash.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    /* A sleek premium loader placed at the bottom so it doesn't block the Durga idol */
    .loader {
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      border-top: 4px solid #D84315;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      position: absolute;
      bottom: 8%; 
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Main Splash Container -->
  <div id="splash-screen">
    <div class="loader"></div>
  </div>

  <script>
    // Hide Splash when Flutter loads completely
    window.addEventListener('flutter-first-frame', function() {
      var splash = document.getElementById('splash-screen');
      if(splash) { 
        splash.remove(); 
      }
    });
  </script>

  <!-- PWA Install Handling Script (Kept exactly as your old code) -->
  <script>
    let deferredPrompt = null;

    window.addEventListener('beforeinstallprompt', (e) => {
      // Prevent Chrome from automatically showing the prompt
      e.preventDefault();
      // Stash the event so it can be triggered later via the Drawer
      deferredPrompt = e;
      console.log("Hoppers PWA: Install prompt stashed and ready.");
    });

    // This function will be called from Dart/Flutter
    function promptPwaInstall() {
      if (deferredPrompt !== null) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            console.log('Hoppers PWA: User accepted the A2HS prompt');
          } else {
            console.log('Hoppers PWA: User dismissed the A2HS prompt');
          }
          deferredPrompt = null;
        });
        return true; 
      } else {
        console.log("Hoppers PWA: Install prompt not available.");
        return false;
      }
    }
  </script>

  <!-- Flutter Loader -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
