<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/hoppers/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- UPDATED: SEO and sharing Description -->
  <meta name="description" content="Hoppers Pujo Guide - The ultimate offline companion for Kolkata Durga Puja.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <!-- UPDATED: iOS App Title -->
  <meta name="apple-mobile-web-app-title" content="Hoppers Pujo Guide">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- UPDATED: Professional Title -->
  <title>Hoppers Pujo Guide</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <!-- 🔒 SECURITY SCRIPT (Protects from Right Click & Inspect Element) -->
  <script>
    // Disable Right Click
    document.addEventListener('contextmenu', event => event.preventDefault());
    
    // Disable F12 / Inspect Element keyboard shortcuts
    document.onkeydown = function (e) {
      if (e.keyCode == 123 || // F12
         (e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'C'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0))) || 
         (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0))) { // Ctrl+U (View Source)
        return false;
      }
    }
  </script>
</body>
</html>
