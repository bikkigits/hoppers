<!DOCTYPE html>
<html>
<head>
  <base href="/hoppers/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Hoppers Pujo Guide - Kolkata Durga Pujo Map">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Hoppers">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.json">
  <title>Hoppers</title>

  <style>
    /* Premium Splash Screen CSS */
    body, html { margin: 0; padding: 0; background-color: #fcfcfc; height: 100%; display: flex; justify-content: center; align-items: center; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .loader-container { text-align: center; }
    .spinner { width: 60px; height: 60px; border: 6px solid #ffe0b2; border-top: 6px solid #FF5722; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .title { color: #FF5722; font-size: 24px; font-weight: bold; letter-spacing: 2px; margin-bottom: 5px; }
    .subtitle { color: #757575; font-size: 14px; }
  </style>
</head>
<body>
  <!-- Yeh screen tab tak dikhegi jab tak Flutter load nahi ho jata -->
  <div class="loader-container" id="splash-screen">
    <div class="spinner"></div>
    <div class="title">HOPPERS</div>
    <div class="subtitle">Loading Pujo Map...</div>
  </div>

  <script>
    // Flutter load hone ke baad splash screen ko hide karne ka script
    window.addEventListener('flutter-first-frame', function() {
      var splash = document.getElementById('splash-screen');
      if(splash) { splash.remove(); }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
