<!DOCTYPE html>
<html>
<head>
  <base href="/hoppers/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Hoppers Pujo Guide - Kolkata Durga Pujo Map">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Hoppers">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.json">
  <title>Hoppers</title>

  <style>
    /* Premium Splash Screen CSS with Star Shower */
    body, html { 
      margin: 0; padding: 0; height: 100%; 
      background: linear-gradient(135deg, #1a0b05 0%, #3e1204 100%); /* Deep rich gradient */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      overflow: hidden; /* Stop scrollbars during loading */
    }
    
    .loader-container { 
      position: absolute; top: 50%; left: 50%; 
      transform: translate(-50%, -50%); 
      text-align: center; z-index: 10;
    }
    
    .spinner { 
      width: 60px; height: 60px; 
      border: 6px solid rgba(255, 255, 255, 0.1); 
      border-top: 6px solid #FF5722; 
      border-radius: 50%; 
      animation: spin 1s linear infinite, pulseGlow 2s ease-in-out infinite; 
      margin: 0 auto 20px auto; 
    }
    
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes pulseGlow { 0% { box-shadow: 0 0 10px rgba(255, 87, 34, 0.2); } 50% { box-shadow: 0 0 25px rgba(255, 87, 34, 0.6); } 100% { box-shadow: 0 0 10px rgba(255, 87, 34, 0.2); } }
    
    .title { color: #ffffff; font-size: 28px; font-weight: 800; letter-spacing: 3px; margin-bottom: 5px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
    .subtitle { color: #ffab91; font-size: 14px; font-weight: 500; letter-spacing: 1px;}

    /* Star Shower CSS */
    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 0 4px white, 0 0 8px white;
      animation: fall linear infinite;
      opacity: 0;
    }

    @keyframes fall {
      0% { transform: translateY(-50px) scale(0); opacity: 0; }
      10% { opacity: 1; }
      80% { transform: translateY(100vh) scale(1); opacity: 0.8; }
      100% { transform: translateY(120vh) scale(0); opacity: 0; }
    }
  </style>
</head>
<body>
  
  <!-- Star Shower Container -->
  <div id="stars-container"></div>

  <!-- Main Loader -->
  <div class="loader-container" id="splash-screen">
    <div class="spinner"></div>
    <div class="title">HOPPERS</div>
    <div class="subtitle">Ready to Explore! 🚀</div>
  </div>

  <script>
    // Generate Stars Dynamically
    const starContainer = document.getElementById('stars-container');
    const numberOfStars = 40; // Number of falling stars
    
    for (let i = 0; i < numberOfStars; i++) {
      let star = document.createElement('div');
      star.className = 'star';
      
      // Randomize position, size, and animation timing
      let leftPos = Math.random() * 100; // 0 to 100vw
      let animDuration = 2 + Math.random() * 4; // 2s to 6s
      let animDelay = Math.random() * 5; // 0s to 5s delay
      
      star.style.left = leftPos + 'vw';
      star.style.animationDuration = animDuration + 's';
      star.style.animationDelay = animDelay + 's';
      
      starContainer.appendChild(star);
    }

    // Hide Splash when Flutter loads
    window.addEventListener('flutter-first-frame', function() {
      var splash = document.getElementById('splash-screen');
      var stars = document.getElementById('stars-container');
      if(splash) { splash.remove(); }
      if(stars) { stars.remove(); }
    });
  </script>

  <!-- PWA Install Handling Script -->
  <script>
    let deferredPrompt = null;

    window.addEventListener('beforeinstallprompt', (e) => {
      // Prevent Chrome from automatically showing the prompt
      e.preventDefault();
      // Stash the event so it can be triggered later via the Drawer
      deferredPrompt = e;
      console.log("Hoppers PWA: Install prompt stashed and ready.");
    });

    // This function will be called from Dart/Flutter
    function promptPwaInstall() {
      if (deferredPrompt !== null) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            console.log('Hoppers PWA: User accepted the A2HS prompt');
          } else {
            console.log('Hoppers PWA: User dismissed the A2HS prompt');
          }
          deferredPrompt = null;
        });
        return true; 
      } else {
        console.log("Hoppers PWA: Install prompt not available.");
        return false;
      }
    }
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
