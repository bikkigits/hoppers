name: hoppers_pwa
description: Offline-first Durga Puja pandal-hopping companion for Kolkata.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.2.2
  url_launcher: ^6.3.1
  geolocator: ^13.0.1
  flutter_svg: ^2.0.10
  collection: ^1.18.0
  confetti: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/icons/